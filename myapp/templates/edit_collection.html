{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Collection</title>
    <link rel="stylesheet" href="{% static 'myapp/styles.css' %}">
</head>
<body>
<div class="container">
    <h2>Edit Your Collection</h2>

    <form method="POST" id="editCollectionForm" class="form-container">
        {% csrf_token %}
        {{ form.as_p }}

        <div class="button-group">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{% url 'collections' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

<script>
    document.getElementById('editCollectionForm').addEventListener('submit', function(event) {
        const itemCheckboxes = document.querySelectorAll('input[name="items"]:checked');
        if (itemCheckboxes.length === 0) {
            alert("You must select at least one item for the collection.");
            event.preventDefault();
        }
    });
</script>
</body>
</html>
