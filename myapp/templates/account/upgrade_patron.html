{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upgrade Patron to Librarian</title>
    <link rel="stylesheet" href="{% static 'myapp/styles.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark-mode');
        }
    </script>
    
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #212529;
            --card-bg: #ffffff;
            --btn-bg: #000000;
            --btn-text: #ffffff;
            --btn-hover-bg: #28a745;
            --toggle-color: #000000;
            --toggle-bg: #ffffff;
            --select-option-color: #212529;
        }
        body.dark-mode {
            --bg-color: #121212;
            --text-color: #f8f9fa;
            --card-bg: #2c2c2c;
            --btn-bg: #28a745;
            --btn-text: #ffffff;
            --btn-hover-bg: #000000;
            --toggle-color: #ffffff;
            --toggle-bg: #000000;
            --select-option-color: #000000;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .card {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: none;
            border-radius: 16px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .form-label, .form-select, .card-title, .card-text {
            color: var(--text-color);
        }
        .form-select option {
            color: var(--select-option-color);
            background-color: var(--card-bg);
        }
        .btn-primary {
            background-color: var(--btn-bg);
            border-color: var(--btn-bg);
            color: var(--btn-text);
            font-weight: 600;
            border-radius: 8px;
            padding: 10px 20px;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        .btn-primary:hover {
            background-color: var(--btn-hover-bg);
            border-color: var(--btn-hover-bg);
            color: var(--btn-text);
        }
        .btn-outline-secondary {
            background-color: transparent;
            border-color: var(--btn-bg);
            color: var(--btn-bg);
            font-weight: 500;
            border-radius: 8px;
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }
        .btn-outline-secondary:hover {
            background-color: var(--btn-hover-bg);
            border-color: var(--btn-hover-bg);
            color: var(--btn-text);
        }
        .dark-toggle {
            background-color: var(--toggle-bg);
            border: 2px solid var(--toggle-color);
            color: var(--toggle-color);
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            position: absolute;
            top: 20px;
            right: 20px;
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }
        body.dark-mode select,
        body.dark-mode select option {
            background-color: #fff !important;
            color: #000 !important;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">
{% include 'navbar.html' %}
<!-- <button class="dark-toggle" id="toggleButton" onclick="toggleDarkMode()">☀️ Light Mode</button> -->

<main class="flex-grow-1 d-flex justify-content-center align-items-center">
    <div class="card shadow p-4" style="width: 100%; max-width: 500px;">
        <div class="card-body text-center">
            <h2 class="card-title mb-4">Upgrade Patron</h2>
            <p class="card-text mb-4">Select a patron to upgrade to librarian.</p>

            <form method="POST" action="">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="patron" class="form-label">Select Patron to Upgrade</label>
                    <select name="patron" id="patron" class="form-select fw-semibold" required>
                        {% for patron in patrons %}
                            <option value="{{ patron.id }}">{{ patron.first_name }} {{ patron.last_name }} ({{ patron.email }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">Upgrade to Librarian</button>
                    <a href="{% url 'librarian_homepage' %}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>

        </div>
    </div>
</main>
{% include 'footer.html' %}


</body>
</html>
