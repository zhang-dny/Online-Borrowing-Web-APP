{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Deletion</title>
    <link rel="stylesheet" href="{% static 'myapp/styles.css' %}">
</head>
<body>
<h2>Confirm Deletion</h2>
<p>Are you sure you want to delete the collection: <strong>{{ collection.title }}</strong>?</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'catalog' %}" class="btn btn-secondary">Cancel</a>
</form>
</body>
</html>
